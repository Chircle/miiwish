name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
      FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      # Kommasepariert, falls mehrere Admin-Accounts, z.B. "aB3xY...,cD9zQ...".
      # UID findest du in der Firebase Console unter Authentication -> Users.
      FIREBASE_ADMIN_UIDS: ${{ secrets.FIREBASE_ADMIN_UIDS }}
      # E-Mail der "Schatz"-Sonderrolle (darf reservierte Wünsche anderer
      # an sich reißen). Muss zusätzlich manuell in isSuperuser() in
      # firestore.rules eingetragen werden.
      FIREBASE_SUPERUSER_EMAIL: ${{ secrets.FIREBASE_SUPERUSER_EMAIL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Write Firebase config file
        shell: bash
        run: |
          cat > firebase-config.js <<EOF
          window.MIIWISH_FIREBASE_CONFIG = {
            apiKey: "${FIREBASE_API_KEY}",
            authDomain: "${FIREBASE_AUTH_DOMAIN}",
            projectId: "${FIREBASE_PROJECT_ID}",
            storageBucket: "${FIREBASE_STORAGE_BUCKET}",
            messagingSenderId: "${FIREBASE_MESSAGING_SENDER_ID}",
            appId: "${FIREBASE_APP_ID}",
            adminUids: "${FIREBASE_ADMIN_UIDS}",
            superuserEmail: "${FIREBASE_SUPERUSER_EMAIL}"
          };
          EOF

      - name: Prepare site artifact
        shell: bash
        run: |
          if [ -f miiwish.html ]; then
            cp miiwish.html index.html
          fi
          touch .nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4